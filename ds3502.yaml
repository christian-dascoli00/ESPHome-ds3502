esphome:
  name: ds3502

external_components:
  - source:
      type: local
      path: components

ota:
  - platform: esphome
    password: ""

api:

logger:

esp32:
  board: esp32doit-devkit-v1
  framework:
    type: esp-idf

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

web_server:
  port: 80

i2c:
  sda: GPIO21
  scl: GPIO22

ds3502:
  - id: pot1
    a0: false # false = GND, true = VCC
    a1: false
    #address: 0x28
    restore_value: false # false = SRAM/volatile mode, true = EEPROM/persistent mode
#  - id: pot2

output:
  - platform: ds3502
    id: pot_output1
    ds3502_id: pot1
#  - platform: ds3502
#    id: pot_output2
#    ds3502_id: pot2

button:
  - platform: ds3502
    name: "Save 1"
    ds3502_id: pot1
#  - platform: ds3502
#    name: "Save 2"
#    ds3502_id: pot2

number:
  - platform: template
    name: "Potentiometer 1"
    id: pot_value1
    unit_of_measurement: "%"
    min_value: 0
    max_value: 100
    step: 1
    optimistic: true
    on_value:
      then:
        - output.set_level:
            id: pot_output1
            level: !lambda 'return id(pot_value1).state / 100.0;'
